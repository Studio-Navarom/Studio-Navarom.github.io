name: Publish SpaceRiders M4.00 static bundle only
on:
  push:
    paths:
      - '.github/workflows/sync-spaceriders-m400.yml'
permissions:
  contents: write
jobs:
  deploy-spaceriders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve CI-validated static bundle
        env:
          ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-6b38-81f5-840a-30761c387728/raw?se=2026-11-17T09%3A48%3A59Z&sp=r&sv=2026-06-06&sr=b&scid=b4f082f1-44ab-5429-a999-9c73df814958&skoid=7b771594-2b4f-4e93-93be-fdeeeb59aaf9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T09%3A42%3A44Z&ske=2026-11-18T09%3A42%3A44Z&sks=b&skv=2026-06-06&sig=k6ppaD/z8609lQYrFbHTfMiOHcqJgRfuqNEZyh6oshE%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 "$ARTIFACT_URL" -o /tmp/spaceriders400.zip
          mkdir -p /tmp/spaceriders400
          unzip -q /tmp/spaceriders400.zip -d /tmp/spaceriders400
          test -s /tmp/spaceriders400/index.html
          test -s /tmp/spaceriders400/assets/index-B-tyEss6.js
          test -s /tmp/spaceriders400/assets/station_hq_independent-ChEJ2P3A.png
          grep -q '/play/spaceriders/assets/index-B-tyEss6.js' /tmp/spaceriders400/index.html
          if find /tmp/spaceriders400 -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.map' -o -name '.env*' \) | grep -q .; then
            echo 'Aborting: private source found in static bundle' >&2
            exit 1
          fi
      - name: Update only game files; retain website and other games
        run: |
          set -euo pipefail
          mkdir -p play/spaceriders
          cp -a /tmp/spaceriders400/. play/spaceriders/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/spaceriders
          if git diff --cached --quiet; then echo 'Already up to date'; exit 0; fi
          git commit -m "Deploy SpaceRiders M4.00 closed-loop economy"
          git push
