name: Publish SpaceRiders M4.01 sharp sprites only
on:
  push:
    paths:
      - '.github/workflows/sync-spaceriders-m401.yml'
permissions:
  contents: write
jobs:
  publish-spaceriders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate approved game build
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-2e38-81f4-ba97-b5ba14020f65/raw?se=2026-11-17T10%3A50%3A10Z&sp=r&sv=2026-06-06&sr=b&scid=8b476342-fbd0-508a-b29e-846c53cecbd2&skoid=7b771594-2b4f-4e93-93be-fdeeeb59aaf9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T06%3A43%3A50Z&ske=2026-11-18T06%3A43%3A50Z&sks=b&skv=2026-06-06&sig=kZ42LEVq%2B5tPVDdzt%2BQcpSP6aIu6Vnji8zWp5XHdwBk%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 "$ARTIFACT_URL" -o /tmp/sr401.zip
          echo "7d2b11039e620950c879a780db0f8b1b15e2a624eb0415ce93e1940b539f2cd1  /tmp/sr401.zip" | sha256sum -c -
          mkdir -p /tmp/sr401
          unzip -q /tmp/sr401.zip -d /tmp/sr401
          test -s /tmp/sr401/index.html
          test -s /tmp/sr401/assets/index-BTKmhake.js
          test -s /tmp/sr401/assets/visual394-D56io_ZV.png
          test -s /tmp/sr401/assets/station_hq_independent-ChEJ2P3A.png
          grep -q '/play/spaceriders/assets/index-BTKmhake.js' /tmp/sr401/index.html
          if find /tmp/sr401 -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.map' -o -name '.env*' \) | grep -q .; then
            echo "Refusing to publish private game sources" >&2
            exit 1
          fi
      - name: Publish only SpaceRiders
        run: |
          set -euo pipefail
          mkdir -p play/spaceriders
          cp -a /tmp/sr401/. play/spaceriders/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/spaceriders
          if git diff --cached --quiet; then echo "Already published"; exit 0; fi
          git commit -m "Publish SpaceRiders M4.01 sharp PC sprites and faction stations"
          git push
