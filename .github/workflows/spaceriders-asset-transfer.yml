name: Assemble verified SpaceRiders production bundle
on:
  push:
    branches: ['deployment/spaceriders-scale-navigation']
    paths: ['.asset-transfer/web/**']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified production bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,base64,hashlib,shutil
          source=Path('.asset-transfer/web')
          for item in json.loads((source/'manifest.json').read_text()):
            target=Path(item['path'])
            assert target.is_relative_to(Path('play/spaceriders')) and '..' not in target.parts
            assert target.suffix in ['.js','.css','.png','.html','.json']
            parts=source/item['parts']
            assert parts.is_relative_to(source) and '..' not in parts.parts
            data=base64.b64decode(''.join(p.read_text() for p in sorted(parts.glob('part-*.txt'))),validate=True)
            digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            assert digest==item['sha'] and len(data)==item['bytes'],target
            if target.suffix=='.js':assert b'sourceMappingURL=' not in data
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(data)
          shutil.rmtree(source)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- play/spaceriders .asset-transfer/web
          git commit -m "Restore verified minified SpaceRiders bundle and remove transfer data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
