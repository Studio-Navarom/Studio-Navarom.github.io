name: Deploy SpaceRiders static bundle (one-time)
on:
  push:
    paths:
      - '.github/workflows/deploy-spaceriders-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public Studio Navarom
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified SpaceRiders build
        env:
          BUNDLE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-edf4-81f4-980a-1d861feb8c3e/raw?se=2026-11-16T20%3A51%3A17Z&sp=r&sv=2026-06-06&sr=b&scid=59ce0637-9b3b-5118-948d-142cbe147140&skoid=7b771594-2b4f-4e93-93be-fdeeeb59aaf9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-16T08%3A24%3A54Z&ske=2026-11-17T08%3A24%3A54Z&sks=b&skv=2026-06-06&sig=sMcL7rBIQo7AI5oLXlc/EDkC23NN9K2TeYD/z2Kmx%2B4%3D"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spaceriders-new"
          curl -fL --retry 3 --connect-timeout 10 --max-time 120 "$BUNDLE_URL" -o "$RUNNER_TEMP/spaceriders.zip"
          unzip -q "$RUNNER_TEMP/spaceriders.zip" -d "$RUNNER_TEMP/spaceriders-new"
          test -s "$RUNNER_TEMP/spaceriders-new/index.html"
          test -n "$(find "$RUNNER_TEMP/spaceriders-new/assets" -maxdepth 1 -name 'index-*.js' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/spaceriders-new/assets" -maxdepth 1 -name 'index-*.css' -print -quit)"
          echo "Artifact validated"
      - name: Install compiled game only
        run: |
          set -euo pipefail
          mkdir -p play/spaceriders/assets
          cp -a "$RUNNER_TEMP/spaceriders-new/assets/." play/spaceriders/assets/
          cp "$RUNNER_TEMP/spaceriders-new/index.html" play/spaceriders/index.html
          git add play/spaceriders/index.html play/spaceriders/assets
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish SpaceRiders M3.92: survey scenery and fleet locator"
          git push origin HEAD:main
